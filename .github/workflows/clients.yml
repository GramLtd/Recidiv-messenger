name: Clients

# Native clients of the web app: Android APK, unsigned iOS IPA, desktop (Windows / macOS / Linux).
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Server URL the apps connect to (VITE_API_URL)'
        required: false
        default: 'https://recidivist.lol'
  push:
    tags:
      - 'v*'
    branches:
      - 'claude/**'
    paths:
      - 'web/**'
      - 'desktop/**'
      - '.github/workflows/clients.yml'

permissions:
  contents: read

env:
  VITE_API_URL: ${{ inputs.api_url || 'https://recidivist.lol' }}
  VITE_TONCONNECT_MANIFEST: ${{ inputs.api_url || 'https://recidivist.lol' }}/tonconnect-manifest.json

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Capacitor 7 / Android Gradle Plugin 8.7 need JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu runners ship the Android SDK (ANDROID_HOME); just add what Capacitor 7 needs
      - name: Install Android platform
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > web/android/local.properties

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build:app

      - name: Capacitor sync
        working-directory: web
        run: npx cap sync android

      - name: Gradle build (debug + unsigned release)
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp web/android/app/build/outputs/apk/debug/app-debug.apk out/Recidivist-debug.apk
          cp web/android/app/build/outputs/apk/release/app-release-unsigned.apk out/Recidivist-release-unsigned.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Recidivist-android
          path: out/*.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build:app

      - name: Capacitor sync (pod install)
        working-directory: web
        run: |
          command -v pod >/dev/null || sudo gem install cocoapods
          npx cap sync ios
          cd ios/App && pod install

      - name: Archive without code signing
        working-directory: web/ios/App
        run: |
          xcodebuild -version
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          test -d "$APP"
          mkdir -p ipa/Payload out
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../out/Recidivist-unsigned.ipa Payload)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Recidivist-ios
          path: out/Recidivist-unsigned.ipa
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix desktop

      - name: Build web app + package
        working-directory: desktop
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Recidivist-desktop-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub release (tags only)
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [android, ios, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false

  # Branch builds: always keep fresh installers at a stable public link
  # https://github.com/GramLtd/Recidiv-messenger/releases/tag/latest
  latest:
    name: Publish "latest" installers
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') && needs.desktop.result == 'success' }}
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Recidivist-*
          merge-multiple: true

      - run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Recidivist — свежая сборка
          prerelease: true
          make_latest: false
          body: |
            Автоматическая сборка из ветки ${{ github.ref_name }} (${{ github.sha }}).
            Windows: Recidivist-Setup-1.0.0-x64.exe (установка) или Recidivist-Portable-1.0.0-x64.exe (без установки).
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.apk
          fail_on_unmatched_files: false
          overwrite_files: true
