plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'lol.recidivist.proxy'
version = '1.0.0'

expoModule {
  v2 true
}

android {
  namespace "lol.recidivist.proxy"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation "com.squareup.okhttp3:okhttp:${expoModule.safeExtGet("okHttpVersion", '4.9.2')}"
}
